<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cyberCyan" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Protective Shield with rounded curves -->
  <path d="M24 4L40 10V22C40 32.5 33.2 41.8 24 44C14.8 41.8 8 32.5 8 22V10L24 4Z" 
        fill="url(#shieldGrad)" 
        fill-opacity="0.16" 
        stroke="url(#shieldGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- Biometric Face Scanning Aperture Frame (Corner Marks) -->
  <path d="M16 16H19" stroke="url(#cyberCyan)" stroke-width="2" stroke-linecap="round" />
  <path d="M16 16V19" stroke="url(#cyberCyan)" stroke-width="2" stroke-linecap="round" />
  
  <path d="M32 16H29" stroke="url(#cyberCyan)" stroke-width="2" stroke-linecap="round" />
  <path d="M32 16V19" stroke="url(#cyberCyan)" stroke-width="2" stroke-linecap="round" />
  
  <path d="M16 32H19" stroke="url(#cyberCyan)" stroke-width="2" stroke-linecap="round" />
  <path d="M16 32V29" stroke="url(#cyberCyan)" stroke-width="2" stroke-linecap="round" />
  
  <path d="M32 32H29" stroke="url(#cyberCyan)" stroke-width="2" stroke-linecap="round" />
  <path d="M32 32V29" stroke="url(#cyberCyan)" stroke-width="2" stroke-linecap="round" />

  <!-- Stylized Biometric Face Nodes & Smile -->
  <circle cx="20" cy="21" r="1.5" fill="#60a5fa" />
  <circle cx="28" cy="21" r="1.5" fill="#60a5fa" />
  
  <!-- Nose bridge & Smile path -->
  <path d="M24 20V24L22.5 25" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M20 28C21.2 29.3 22.5 30 24 30C25.5 30 26.8 29.3 28 28" stroke="#38bdf8" stroke-width="1.75" stroke-linecap="round" />

  <!-- Central Pulse Target -->
  <circle cx="24" cy="24" r="10" stroke="url(#cyberCyan)" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />
</svg>
