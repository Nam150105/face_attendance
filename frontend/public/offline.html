<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070913" />
    <title>Không có kết nối — Face Attendance</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse 80% 50% at 50% -20%, rgba(37, 99, 235, 0.18), transparent),
          #060913;
        color: #f8fafc;
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.55;
        letter-spacing: -0.01em;
      }
      .panel {
        width: 100%;
        max-width: 420px;
        text-align: center;
        background: #0e1529;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
        border-radius: 20px;
        padding: 32px 24px;
      }
      img {
        width: 56px;
        height: 56px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
      }
      p {
        font-size: 13.5px;
        color: #94a3b8;
        margin-bottom: 20px;
      }
      ul {
        text-align: left;
        font-size: 13.5px;
        color: #94a3b8;
        padding-left: 18px;
        margin-bottom: 24px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      button {
        width: 100%;
        min-height: 44px;
        padding: 12px 20px;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <img src="/logo.svg" alt="" />
      <h1>Không có kết nối mạng</h1>
      <p>
        Ứng dụng đã mở được nhưng chưa liên lạc được với máy chủ. Việc chấm công và điểm danh cần mạng
        để xác thực nên chưa thể thực hiện lúc này.
      </p>
      <ul>
        <li>Kiểm tra Wi-Fi hoặc dữ liệu di động.</li>
        <li>Tắt chế độ máy bay nếu đang bật.</li>
        <li>Di chuyển tới nơi có sóng tốt hơn rồi thử lại.</li>
      </ul>
      <button type="button" onclick="location.reload()">Thử lại</button>
    </main>
  </body>
</html>
